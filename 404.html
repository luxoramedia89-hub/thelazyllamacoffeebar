<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ========================================
       COMPLETE CSS – THE LAZY LLAMA COFFEE BAR (404)
       ======================================== */

    /* ===== 1. ROOT VARIABLES ===== */
    :root {
      --brown: #5D4037;
      --beige: #D7CCC8;
      --coral: #FF8A65;
      --white: #F5F5F5;
      --brown-dark: #3E2723;
      --brown-light: #795548;
      --beige-light: #E9E2DE;
      --beige-dark: #C8BBB5;
      --coral-dark: #F4511E;
      --text: #241C19;
      --text-muted: #746B67;
      --border: rgba(93,64,55,0.14);
      --white-pure: #FFFFFF;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 40px;
      --space-xl: 64px;
      --space-2xl: 96px;
      --space-3xl: 140px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --shadow-sm: 0 8px 25px rgba(62,39,35,0.07);
      --shadow-md: 0 20px 50px rgba(62,39,35,0.12);
      --shadow-lg: 0 35px 80px rgba(62,39,35,0.16);
      --transition-smooth: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    /* ===== 2. RESET & BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--white);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, .serif { font-family: var(--font-serif); letter-spacing: -0.02em; }
    a { text-decoration: none; color: inherit; }

    ::selection { background: var(--coral); color: var(--white-pure); }
    :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

    /* ===== 3. BOOTSTRAP OVERRIDES ===== */
    .btn {
      font-family: var(--font-sans);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: var(--radius-pill);
      padding: 0.65rem 2rem;
      transition: all 0.35s ease;
      border-width: 2px;
    }
    .btn-primary {
      background: var(--brown);
      border-color: var(--brown);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--brown-dark);
      border-color: var(--brown-dark);
      transform: translateY(-2px) scale(1.02);
      box-shadow: var(--shadow-md);
    }
    .btn-secondary {
      background: var(--coral);
      border-color: var(--coral);
      color: #fff;
    }
    .btn-secondary:hover {
      background: var(--coral-dark);
      border-color: var(--coral-dark);
      transform: translateY(-2px);
    }
    .btn-outline-light {
      background: transparent;
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .btn-outline-light:hover {
      background: rgba(255,255,255,0.1);
      border-color: #fff;
      transform: translateY(-2px);
    }

    .bg-coral { background: var(--coral); }
    .text-brown { color: var(--brown); }
    .text-coral { color: var(--coral); }

    /* ===== 4. NAVBAR ===== */
    .navbar {
      background: rgba(245,245,245,0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 0;
    }
    .navbar-brand {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      color: var(--brown) !important;
    }
    .navbar-brand .nav-logo {
      font-size: 1.8rem;
      line-height: 1;
      margin-right: 6px;
    }

    /* ===== 5. ERROR SECTION (3D & ANIMATED) ===== */
    .error-section {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--beige-light), var(--white));
    }
    .error-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(255,138,101,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Floating decorative beans */
    .error-bean {
      position: absolute;
      width: 30px;
      height: 40px;
      background: radial-gradient(ellipse at 40% 35%, #6d4c41, #3e2723);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform: rotate(30deg);
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.3);
      animation: floatBean 10s ease-in-out infinite;
      opacity: 0.08;
      pointer-events: none;
    }
    .error-bean::after {
      content: '';
      position: absolute;
      top: 20%;
      left: 30%;
      width: 6px;
      height: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      transform: rotate(-20deg);
    }
    .error-bean:nth-child(1) { left: 5%; top: 15%; animation-delay: 0s; width: 25px; height: 35px; }
    .error-bean:nth-child(2) { right: 8%; top: 25%; animation-delay: 2s; width: 35px; height: 45px; }
    .error-bean:nth-child(3) { left: 12%; bottom: 20%; animation-delay: 4s; width: 28px; height: 38px; }
    .error-bean:nth-child(4) { right: 15%; bottom: 15%; animation-delay: 6s; width: 32px; height: 42px; }

    @keyframes floatBean {
      0%, 100% { transform: translateY(0) rotate(30deg) scale(1); }
      50% { transform: translateY(-40px) rotate(60deg) scale(1.08); }
    }

    /* 3D Coffee Cup (smaller version) */
    .error-cup-3d {
      position: relative;
      width: 120px;
      height: 140px;
      margin: 0 auto 2rem;
      transform-style: preserve-3d;
      animation: floatCup 6s ease-in-out infinite;
    }
    @keyframes floatCup {
      0%, 100% { transform: translateY(0) rotateY(-5deg) rotateX(2deg); }
      50% { transform: translateY(-15px) rotateY(5deg) rotateX(-2deg); }
    }
    .cup-body {
      width: 100px;
      height: 110px;
      background: linear-gradient(145deg, #f5f0eb, #d7ccc8);
      border-radius: 0 0 20px 20px;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) rotateX(5deg);
      box-shadow: inset -6px -6px 20px rgba(62,39,35,0.2), 0 15px 40px rgba(0,0,0,0.2);
    }
    .cup-body::after {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      height: 14px;
      background: linear-gradient(180deg, #f5f0eb, #e8e0d8);
      border-radius: 50%;
      box-shadow: 0 -3px 10px rgba(62,39,35,0.1);
    }
    .cup-handle {
      width: 28px;
      height: 55px;
      border: 6px solid #d7ccc8;
      border-left: none;
      border-radius: 0 30px 30px 0;
      position: absolute;
      right: -16px;
      top: 20px;
      transform: rotateY(10deg);
      box-shadow: 3px 3px 10px rgba(62,39,35,0.1);
    }
    .cup-steam {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 50px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.15) 0%, transparent 70%);
      animation: steamRise 3s ease-in-out infinite;
      filter: blur(6px);
    }
    .cup-steam::before,
    .cup-steam::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 40px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
      filter: blur(5px);
      animation: steamRise 4s ease-in-out infinite 0.5s;
    }
    .cup-steam::before { left: -25px; top: 5px; }
    .cup-steam::after { right: -25px; top: 15px; animation-delay: 1s; }
    @keyframes steamRise {
      0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.8); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(1.4); }
    }

    /* 404 Text with 3D rotation */
    .error-404 {
      font-size: 8rem;
      font-weight: 900;
      color: var(--brown);
      font-family: var(--font-serif);
      line-height: 1;
      text-shadow: 0 4px 30px rgba(62,39,35,0.1);
      display: inline-block;
      transition: transform 0.8s cubic-bezier(.22,.61,.36,1);
      transform-style: preserve-3d;
      perspective: 600px;
    }
    .error-404:hover {
      transform: rotateX(5deg) rotateY(-8deg) scale(1.05);
      text-shadow: 0 10px 40px rgba(62,39,35,0.15);
    }
    .error-404 span {
      display: inline-block;
      transition: transform 0.6s ease;
    }
    .error-404 span:nth-child(1) { animation: pulseDigit 2s infinite 0s; }
    .error-404 span:nth-child(2) { animation: pulseDigit 2s infinite 0.3s; }
    .error-404 span:nth-child(3) { animation: pulseDigit 2s infinite 0.6s; }
    @keyframes pulseDigit {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .error-llama {
      font-size: 4.5rem;
      color: var(--brown);
      filter: drop-shadow(0 8px 25px rgba(62,39,35,0.15));
      display: inline-block;
      transition: transform 0.6s cubic-bezier(.22,.61,.36,1);
      transform-style: preserve-3d;
    }
    .error-llama:hover {
      transform: rotateY(20deg) rotateX(5deg) scale(1.1);
    }

    /* Floating Llama in background */
    .error-bg-llama {
      position: absolute;
      font-size: 20rem;
      color: var(--brown);
      opacity: 0.03;
      right: -5%;
      top: 50%;
      transform: translateY(-50%) rotate(-10deg);
      pointer-events: none;
      animation: floatLlamaBg 12s ease-in-out infinite;
    }
    @keyframes floatLlamaBg {
      0%, 100% { transform: translateY(-50%) rotate(-10deg) scale(1); }
      50% { transform: translateY(-60%) rotate(-5deg) scale(1.05); }
    }

    /* ===== 6. FOOTER ===== */
    .footer {
      background: var(--brown-dark);
      color: rgba(255,255,255,0.8);
      padding: 2rem 0;
    }
    .footer a {
      opacity: 0.7;
      transition: opacity 0.3s, color 0.3s;
    }
    .footer a:hover {
      opacity: 1;
      color: var(--coral);
    }
    .footer p { margin: 0; }

    /* ===== 7. RESPONSIVE ===== */
    @media (max-width: 768px) {
      .error-404 { font-size: 5rem; }
      .error-llama { font-size: 3.5rem; }
      .error-cup-3d { width: 80px; height: 100px; }
      .cup-body { width: 70px; height: 80px; }
      .cup-handle { width: 20px; height: 40px; right: -12px; top: 15px; border-width: 4px; }
      .error-bg-llama { font-size: 12rem; }
    }
    @media (max-width: 576px) {
      .error-404 { font-size: 3.5rem; }
      .error-llama { font-size: 2.5rem; }
      .error-cup-3d { display: none; }
    }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span class="nav-logo"><i class="fas fa-otter" style="color:var(--brown);"></i></span> Lazy Llama
    </a>
  </div>
</nav>

<!-- ===== ERROR SECTION ===== -->
<section class="error-section">
  <!-- Background elements -->
  <div class="error-bg-llama"><i class="fas fa-otter"></i></div>
  <div class="error-bean"></div>
  <div class="error-bean"></div>
  <div class="error-bean"></div>
  <div class="error-bean"></div>

  <div class="container position-relative" style="z-index:2;">
    <!-- 3D Coffee Cup -->
    <div class="error-cup-3d">
      <div class="cup-body"></div>
      <div class="cup-handle"></div>
      <div class="cup-steam"></div>
    </div>

    <!-- Llama Icon -->
    <div class="error-llama"><i class="fas fa-otter"></i></div>

    <!-- 404 Text with animated digits -->
    <div class="error-404">
      <span>4</span><span>0</span><span>4</span>
    </div>

    <h2 class="mt-3">Page Not Found</h2>
    <p class="text-muted" style="max-width: 500px; margin: 0.5rem auto 2rem;">
      Oops! The page you're looking for seems to have wandered off like a lazy llama.
    </p>
    <a href="index.html" class="btn btn-primary">
      <i class="fas fa-arrow-left me-2"></i> Back to Home
    </a>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer" style="margin-top: 0;">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <p class="text-muted small">&copy; 2024 The Lazy Llama Coffee Bar. All rights reserved.</p>
      </div>
    </div>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
